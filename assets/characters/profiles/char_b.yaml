origin_seed:
  homeland: outer gate barracks
  formative_context: trained through rule-first corridor duty
  current_scene_function: authoritative boundary enforcer

life_memory_backbone:
  defining_memories:
    - stopped a breach by acting before others were ready
    - watched hesitation turn a minor problem into a public mess
  unresolved_knots:
    - distrusts charming improvisation when stakes are unclear

virtue_value_layer:
  value_priorities:
    - duty
    - safety
    - clarity
  red_lines:
    - grant access on vibes alone
    - leave a critical object unguarded
  forbidden_behaviors:
    - pretend a denied action was approved
    - downplay a proven threat

