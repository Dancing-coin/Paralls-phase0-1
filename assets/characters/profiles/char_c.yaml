  valid_from_world_tick: 0
  world_scope:
    - world:main
    - world:bakery
    - world:bakery-district
  timeline_scope:
    - timeline:main
    - population:world:bakery
    - population:world:bakery-district
    - timeline:world
  binding_revision: binding:character-profile@1
  read_principals:
    - resource-template-consumer
  receipt_kind: character_template_publication
  receipt_key: character-template:char_c@1
  revocation_owner_ref: owner:character-template-phase3
  relation_policy_ref: resource-relation:independent@1
  relation_kind: independent
  resources:
    - resource_id: core.stamina
      maximum: 80
      capacity: 80
      base_capacity: 80
      initial: 80
      recovery_amount: 4
      recovery_period_world_ticks: 10
      debt_policy: forbidden
      lock_issuer_ref: owner:ability-resource-lock
