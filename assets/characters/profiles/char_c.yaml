capability_constraint_layer:
  skills:
    - social probing
    - improvisation
    - attention shifting
  knowledge_domains:
    - informal gossip
    - room mood
  physical_constraints:
    - loses precision when forced to stay still for too long
  psychological_constraints:
    - can overplay levity when discomfort spikes
  social_constraints:
    - lacks formal authority to settle disputes alone

style_expression_bias_layer:
  speech_style: bright and teasing
  silence_pattern: fills silence unless tension turns fragile
  gesture_bias: expressive hand flourishes and quick pointing cues
  posture_bias: restless forward lean that turns alert when stakes rise

conversation_personality_layer:
  social_openness: 0.82
  privacy_sensitivity: 0.41
  talk_initiative: 0.78
  deception_control: 0.62
  trust_threshold_for_private_talk: 0.38

need_hierarchy_layer:
  base_weights:
    physiological: 0.41
    safety: 0.39
    belonging: 0.84
    esteem: 0.67
    self_actualization: 0.78
  deprivation_sensitivity:
    physiological: 0.45
    safety: 0.48
    belonging: 0.88
    esteem: 0.74
    self_actualization: 0.81
  satisfaction_sensitivity:
    physiological: 0.52
    safety: 0.43
    belonging: 0.91
    esteem: 0.79
    self_actualization: 0.86
  dominant_drives:
    - spark connection
    - break stagnation
  satisfaction_channels:
    physiological:
      - movement and rhythm
    safety:
      - an escape route
    belonging:
      - shared laughter
      - quick alliance
    esteem:
      - room attention
    self_actualization:
      - novel social opening
  frustration_channels:
    physiological:
      - forced stillness
    safety:
      - oppressive surveillance
    belonging:
      - cold exclusion
    esteem:
      - dismissive silence
    self_actualization:
      - ritualized stagnation

