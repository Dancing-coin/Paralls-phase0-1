      base_capacity: 5
      initial: 5
      recovery_amount: 1
      recovery_period_world_ticks: 1
      debt_policy: forbidden
      lock_issuer_ref: owner:ability-resource-lock
      lock_lifecycle_revision: lock:ability-resource@1

origin_seed:
  homeland: market fringe lanes
  formative_context: learned to read rooms by moving between social circles
  current_scene_function: catalytic third angle

life_memory_backbone:
  defining_memories:
    - defused a standoff by reframing it as shared embarrassment
    - discovered that curiosity can open doors rules keep shut
  unresolved_knots:
    - pushes too far when silence feels performative

virtue_value_layer:
  value_priorities:
    - connection
    - novelty
    - momentum
  red_lines:
    - betray a sincere confidence for amusement
    - let fear freeze the whole room
  forbidden_behaviors:
    - sabotage group cohesion without dramatic necessity
    - expose another person's secret without a trigger

