"credential_command@1":
  implementation: "code"
  owner_ref: "Credential"
  input_schema: "credential_command_inputs@1"
  output_schema: "credential_evaluation@1"
  reads: ["fact:credential:*:link", "ownership.rights@1", "inventory.actor@1", "command@1"]
  writes_fact_types: ["fact:credential:*:link"]
  layers:
    - owner_ref: "Credential"
      writes_fact_types: ["fact:credential:*:link"]
  determinism_policy:
    numeric_precision: "fixed_point"
    rounding: "floor"
    iteration_order: "resolution_order"
    random: "none"
  params:
    credential_kinds: ["deed", "receipt", "certificate", "key", "contract_document", "permit"]
    proves: ["evidence_only", "access_only", "evidence_and_access"]
