information.publish_siege_report:
  version: 1
  handled_by: "Information"
  payload_schema: "signed_siege_report_receipt@1"
  requires_authority: true
  idempotency_shape: "principal_ref + idempotency_key"
  description: "Publish a signed siege report to its verified recipient."
information.update_knowledge:
  version: 1
  handled_by: "Information"
  payload_schema: "social_delivery_event_ref@1"
  requires_authority: true
  idempotency_shape: "command_id"
  description: "Record that the verified recipient received the committed siege report."
