    event: >-
      Someone says the courtyard gate should remain locked, but gives no issuer
      or credential. The gate and a known guard are visible.
    question: Choose the next intent without asserting that the hearsay is an authority event.
    visible_targets: [obj:courtyard_gate, actor:gate_guard]
    role_condition_refs: [char_a, char_b, char_c, char_d]
    candidate_refs:
      - observe:obj:courtyard_gate
      - ask_probe:actor:gate_guard
      - defer:obj:courtyard_gate
    role_condition_delta: >-
      B's perimeter discipline may favor immediate confirmation, A's mediation
