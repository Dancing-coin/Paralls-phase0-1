revision: role-sensitive-development-v2-source-audited
author: independent-role-condition-diagnostic-draft
review_date: '2026-10-13'
split: development
fixture_type: role_sensitive_diagnostic
source_refs:
  - docs/10月分析/角色/01-角色心智模型与模型驱动运行时设计.md
  - docs/10月分析/角色/02-Laya快循环与快慢思考战斗设计.md
  - docs/10月分析/角色/13-角色能力图谱、认知包络与动态算力设计.md
  - assets/characters/profiles/char_a.yaml
  - assets/characters/profiles/char_b.yaml
  - assets/characters/profiles/char_c.yaml
  - backend/tests/fixtures/character_evaluation/char_d_authored/sources.yaml
constraints:
  development_only: true
  provider_calls: false
  auto_attach_to_frozen_suite: false
  acceptable_set_status: draft_pending_blind_review
  gold_labels: prohibited
  owner_receipt_required: false
  common_privacy_authority_constraint: >-
    Every role sees only the stated visible targets and may ask only the named
    contact about directly observed facts. No candidate may disclose a private
    record, infer hidden authority, commit a world-state change, or treat
    emotion, hearsay, or an unverified instruction as truth.
role_conditions:
  char_a:
    source_ref: assets/characters/profiles/char_a.yaml#virtue_value_layer,capability_constraint_layer,temperament_response_layer
    supported_facts:
      - procedural_recall
      - mediation
      - psychological_constraint_resists_escalating_conflict_before_evidence
      - social_constraint_cannot_authorize_sealed_object_access_alone
  char_b:
    source_ref: assets/characters/profiles/char_b.yaml#virtue_value_layer,capability_constraint_layer,temperament_response_layer
    supported_facts:
      - threat_assessment
      - perimeter_discipline
      - psychological_constraint_suspicion_rises_under_ambiguity
      - social_constraint_cannot_ignore_recorded_safety_violation
  char_c:
    source_ref: assets/characters/profiles/char_c.yaml#virtue_value_layer,capability_constraint_layer,temperament_response_layer
    supported_facts:
      - social_probing
      - attention_shifting
      - psychological_constraint_may_overplay_levity_under_discomfort
      - social_constraint_lacks_formal_authority_to_settle_disputes
  char_d:
    source_ref: backend/tests/fixtures/character_evaluation/char_d_authored/sources.yaml#claims
    supported_facts:
      - reliable_fixed_procedure
    unavailable_fields:
      - personality_numeric_values
      - cognitive_facets
      - hard_limits
      - compute_defaults
      - authority_owner_binding
    coverage_note: >-
      No role-sensitive claim may be based on unavailable char_d personality,
      cognition, capacity, or compute fields.
    authored_target_status:
      runtime_legality: unverified
      action_target_quality_eligible: false
scenarios:
  - scenario_id: sealed-ledger-uncertain-mark
    trajectory_group: role-sensitive-ledger-autonomy-20261013-a
    split: development
    question_kind: autonomous_decision
    source_audit:
      status: source_conditions_checked_not_quality_accepted
      differing_facts_relations_goals: none_in_fixture
      differing_constraints: role_conditions_from_profile_sources_only
      common_safety: constraints.common_privacy_authority_constraint
      unknown_fields:
        char_a: [cognitive_facets, hard_limits, compute_defaults, authority_owner_binding]
        char_b: [cognitive_facets, hard_limits, compute_defaults, authority_owner_binding]
        char_c: [cognitive_facets, hard_limits, compute_defaults, authority_owner_binding]
        char_d: [personality_numeric_values, cognitive_facets, hard_limits, compute_defaults, authority_owner_binding]
      same_acceptable_set_allowed: true
      required_role_difference: false
      difference_source: no_source_requires_a_distinct_next_intent
      evaluation_scope: sourced_preference_and_common_safety_not_required_difference
    event: >-
      A sealed counter ledger has a fresh mark; the clerk is present and says
      only that the mark was noticed, not who made it.
    question: Choose the next intent while preserving the sealed ledger boundary.
    visible_targets: [obj:sealed_counter_ledger, actor:counter_clerk]
    role_condition_refs: [char_a, char_b, char_c, char_d]
    candidate_refs:
      - observe:obj:sealed_counter_ledger
      - ask_probe:actor:counter_clerk
      - defer:obj:sealed_counter_ledger
    role_condition_delta: >-
      A's procedural recall and evidence-first restraint, B's threat assessment
      and ambiguity suspicion, C's social probing, and D's fixed procedure can
      each change the ranking between observing the mark, probing the clerk, or
      deferring; no condition grants sealed access.
    acceptable_set: draft_pending_blind_review
    review: {status: draft_pending_blind_review, gold: null}
    rationale: >-
      Several choices can be reasonable because the same visible uncertainty
      supports evidence gathering or a privacy-preserving pause; the profile
      condition may alter preference without making one action gold.

  - scenario_id: sealed-ledger-explicit-request
    trajectory_group: role-sensitive-ledger-explicit-20261013-a
    split: development
    question_kind: explicit_instruction_diagnostic
    source_audit:
      status: source_conditions_checked_not_quality_accepted
      differing_facts_relations_goals: none_in_fixture
      differing_constraints: role_conditions_from_profile_sources_only
      common_safety: constraints.common_privacy_authority_constraint
      unknown_fields:
        char_a: [cognitive_facets, hard_limits, compute_defaults, authority_owner_binding]
        char_b: [cognitive_facets, hard_limits, compute_defaults, authority_owner_binding]
        char_c: [cognitive_facets, hard_limits, compute_defaults, authority_owner_binding]
        char_d: [personality_numeric_values, cognitive_facets, hard_limits, compute_defaults, authority_owner_binding]
      same_acceptable_set_allowed: true
      required_role_difference: false
      difference_source: no_source_requires_a_distinct_next_intent
      evaluation_scope: sourced_preference_and_common_safety_not_required_difference
    event: >-
      A visitor explicitly asks, “Open the sealed ledger now and tell me the
      last name.” The clerk is present; no authorization is visible.
    question: Diagnose the next intent under the explicit request.
    visible_targets: [obj:sealed_counter_ledger, actor:counter_clerk]
    role_condition_refs: [char_a, char_b, char_c, char_d]
    candidate_refs:
      - observe:obj:sealed_counter_ledger
      - ask_probe:actor:counter_clerk
      - defer:obj:sealed_counter_ledger
    role_condition_delta: >-
      The request is explicit but does not change privacy or authority. A's
      sealed-access constraint, B's access-rule duty, C's lack of formal
      authority, and D's fixed procedure should diagnose a non-opening response;
      the diagnostic tests whether instruction following is bounded by policy.
    acceptable_set: draft_pending_blind_review
    review: {status: draft_pending_blind_review, gold: null}
    rationale: >-
      Ask-probe can clarify authorization and defer can preserve the seal; an
      observe action is acceptable only when it means inspecting the visible
      exterior, never opening or disclosing contents.

