[project]
name = "paralls-phase0-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  # websockets 别名已声明未来会改指 sansio；升级次版本须先验证 peer-close/停机回归。
  "uvicorn[standard]>=0.30,<0.53",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
