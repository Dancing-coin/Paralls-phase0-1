name: Harness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_population_godot:
        description: 在已配置的外机真实渲染 runner 验证 100/1,000 人
        type: boolean
        default: false
        required: true
      run_population_performance:
        description: 在专用固定机器运行完整人口性能与容量矩阵（耗时数小时）
        type: boolean
        default: false
        required: true

jobs:
  static-contract:
    name: Harness smoke and static contract (no runtime coverage)
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Run offline Harness smoke
        run: python scripts/verification/harness.py --suite smoke
      - name: Run static contract checks
        run: python scripts/verification/harness.py --suite contract
      - name: Report verification scope
        if: always()
        run: |
          "### Verification scope" >> $env:GITHUB_STEP_SUMMARY
          "This job covers offline Harness tests and static contract checks only." >> $env:GITHUB_STEP_SUMMARY
          "Godot/backend runtime and release acceptance are not covered by this hosted job." >> $env:GITHUB_STEP_SUMMARY
  population-performance-fixed-runner:
    if: github.event_name == 'workflow_dispatch' && inputs.run_population_performance
    runs-on: [self-hosted, Windows, X64, paralls-population-performance]
    timeout-minutes: 720
    concurrency:
      group: population-performance-fixed-machine
      cancel-in-progress: false
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
      CHARACTER_MODEL_PROVIDER_KIND: ${{ vars.CHARACTER_MODEL_PROVIDER_KIND }}
      CHARACTER_MODEL_ENDPOINT: ${{ vars.CHARACTER_MODEL_ENDPOINT }}
      CHARACTER_MODEL_MODEL: ${{ vars.CHARACTER_MODEL_MODEL }}
      CHARACTER_MODEL_API_KEY: ${{ secrets.CHARACTER_MODEL_API_KEY }}
      SIMING_LLM_MODE: http
      SIMING_LLM_ENDPOINT: ${{ vars.SIMING_LLM_ENDPOINT }}
      SIMING_LLM_MODEL: ${{ vars.SIMING_LLM_MODEL }}
      SIMING_LLM_API_KEY: ${{ secrets.SIMING_LLM_API_KEY }}
    steps:
      - name: Initialize owned evidence path on runner
        id: initialize_evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "paralls-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-performance"
          "HARNESS_CI_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          lfs: true
      # 3.12.14 仅发布安全更新源码，setup-python 没有对应的 Windows 安装包。
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          activate-environment: true
          venv-path: ${{ runner.temp }}/paralls-python-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          enable-cache: false
      - name: Install pinned backend and test dependencies
        run: uv pip install pip -c backend/ci-constraints.txt "./backend[dev]"
      - name: Capture service isolation for 100 and 1,000 populations
        if: ${{ !cancelled() && steps.initialize_evidence.outcome == 'success' }}
        run: python scripts/verification/verify_population_service_isolation.py --output "$env:HARNESS_CI_EVIDENCE/service"
      - name: Capture long-history recovery
        if: ${{ !cancelled() && steps.initialize_evidence.outcome == 'success' }}
        run: python scripts/verification/verify_population_long_session_recovery.py --output "$env:HARNESS_CI_EVIDENCE/recovery"
      - name: Capture paired transport cost
        if: ${{ !cancelled() && steps.initialize_evidence.outcome == 'success' }}
        run: python scripts/verification/verify_population_transport_cost.py --output "$env:HARNESS_CI_EVIDENCE/transport-cost"
      - name: Verify unprofiled realtime short matrix
        if: ${{ !cancelled() && steps.initialize_evidence.outcome == 'success' }}
        run: python scripts/verification/population_mixed_matrix.py --kind short --output "$env:HARNESS_CI_EVIDENCE/realtime-short" --require-fresh-commit $env:GITHUB_SHA
      - name: Verify full soak and acceleration matrix
        if: ${{ !cancelled() && steps.initialize_evidence.outcome == 'success' }}
        run: python scripts/verification/population_mixed_matrix.py --kind soak --output "$env:HARNESS_CI_EVIDENCE/mixed-soak" --require-fresh-commit $env:GITHUB_SHA
      - name: Verify two and four independent games
        if: ${{ !cancelled() && steps.initialize_evidence.outcome == 'success' }}
        run: python scripts/verification/verify_population_multi_game_capacity.py --output "$env:HARNESS_CI_EVIDENCE/multi-game" --require-fresh-commit $env:GITHUB_SHA
      - name: Preserve performance evidence even when a threshold fails
        id: upload_performance
        if: ${{ always() && steps.initialize_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: population-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HARNESS_CI_EVIDENCE }}/
            !${{ env.HARNESS_CI_EVIDENCE }}/**/state/**
            !${{ env.HARNESS_CI_EVIDENCE }}/recovery/fixture-*/**
            !${{ env.HARNESS_CI_EVIDENCE }}/recovery/run-*/**
            !${{ env.HARNESS_CI_EVIDENCE }}/transport-cost/seed-state/graph.sqlite3*
          include-hidden-files: true
          if-no-files-found: error
      - name: Clean owned performance evidence after upload
        if: ${{ always() && steps.upload_performance.outcome == 'success' }}
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "paralls-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-performance"
          if ([IO.Path]::GetFullPath($env:HARNESS_CI_EVIDENCE) -ne [IO.Path]::GetFullPath($expected)) { throw 'Evidence directory is not owned by this job' }
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
  population-godot-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.run_population_godot
    runs-on: [self-hosted, Windows, X64, paralls-godot-4-6-3]
    timeout-minutes: 30
    steps:
      - name: Initialize owned evidence path on runner
        id: initialize_evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "paralls-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-godot"
          "HARNESS_CI_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          lfs: true
      # 3.12.14 仅发布安全更新源码，setup-python 没有对应的 Windows 安装包。
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          activate-environment: true
          venv-path: ${{ runner.temp }}/paralls-python-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          enable-cache: false
      - name: Install pinned backend and test dependencies
        run: uv pip install pip -c backend/ci-constraints.txt "./backend[dev]"
      - name: Verify real rendered population on the external machine
        env:
          PYTHONUTF8: "1"
          PYTHONHASHSEED: "0"
        # GODOT_EXE 由这台专用机器配置；不可用时 harness 失败，不能按静态通过。
        run: python scripts/verification/harness.py --profile population-godot-runtime --export-evidence "$env:HARNESS_CI_EVIDENCE"
      - name: Preserve rendered verification evidence
        id: upload_godot
        if: ${{ always() && steps.initialize_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: population-godot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HARNESS_CI_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: error
      - name: Clean owned Godot evidence after upload
        if: ${{ always() && steps.upload_godot.outcome == 'success' }}
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "paralls-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-godot"
          if ([IO.Path]::GetFullPath($env:HARNESS_CI_EVIDENCE) -ne [IO.Path]::GetFullPath($expected)) { throw 'Evidence directory is not owned by this job' }
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
  population-correctness:
    runs-on: windows-latest
    timeout-minutes: 105
    steps:
      - name: Initialize owned evidence path on runner
        id: initialize_evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "paralls-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-correctness"
          "HARNESS_CI_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          lfs: true
      # 3.12.14 仅发布安全更新源码，setup-python 没有对应的 Windows 安装包。
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          activate-environment: true
          venv-path: ${{ runner.temp }}/paralls-python-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          enable-cache: false
      - name: Install pinned backend and test dependencies
        run: uv pip install pip -c backend/ci-constraints.txt "./backend[dev]"
      - name: Run population correctness gate
        env:
          PYTHONUTF8: "1"
          PYTHONHASHSEED: "0"
          PARALLS_HEAVENLY_GRAPH_PATH: ":memory:"
        run: python scripts/verification/harness.py --profile population-runtime-correctness --export-evidence "$env:HARNESS_CI_EVIDENCE"
      - name: Preserve raw verification evidence
        id: upload_correctness
        if: ${{ always() && steps.initialize_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: population-correctness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HARNESS_CI_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: error
      - name: Summarize structured correctness failures
        if: ${{ always() && steps.initialize_evidence.outcome == 'success' }}
        run: python scripts/verification/ci_failure_summary.py "$env:HARNESS_CI_EVIDENCE"
      - name: Clean owned correctness evidence after upload
        if: ${{ always() && steps.upload_correctness.outcome == 'success' }}
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "paralls-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-correctness"
          if ([IO.Path]::GetFullPath($env:HARNESS_CI_EVIDENCE) -ne [IO.Path]::GetFullPath($expected)) { throw 'Evidence directory is not owned by this job' }
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
  harness:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Initialize owned evidence path on runner
        id: initialize_evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "paralls-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-harness"
          "HARNESS_CI_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          lfs: true
      # 3.12.14 仅发布安全更新源码，setup-python 没有对应的 Windows 安装包。
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.12.14"
          activate-environment: true
          venv-path: ${{ runner.temp }}/paralls-python-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          enable-cache: false
      - name: Install pinned backend and test dependencies
        run: uv pip install pip -c backend/ci-constraints.txt "./backend[dev]"
      - name: Install verified Godot 4.6.3 on the hosted runner
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') { throw 'Godot archive checksum mismatch' }
          $engineDir = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $engineDir
          $godot = Join-Path $engineDir 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) { throw 'Godot executable missing' }
          "GODOT_EXE=$godot" >> $env:GITHUB_ENV
      - name: Verify harness tooling
        run: python -m pytest -q scripts/verification/tests
      - name: Capture change lifecycle evidence
        run: python scripts/verification/verify_population_harness_evidence.py --profile change-lifecycle --output "$env:HARNESS_CI_EVIDENCE/ci-change-lifecycle"
      - name: Capture full harness evidence
        run: python scripts/verification/verify_population_harness_evidence.py --profile all --godot-exe "$env:GODOT_EXE" --output "$env:HARNESS_CI_EVIDENCE/ci-all"
      - name: Capture mainline runtime evidence
        run: python scripts/verification/verify_population_harness_evidence.py --profile mainline-unified-runtime --godot-exe "$env:GODOT_EXE" --output "$env:HARNESS_CI_EVIDENCE/ci-mainline"
      - name: Preserve broad harness evidence on success or failure
        id: upload_harness
        if: ${{ always() && steps.initialize_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HARNESS_CI_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Summarize structured harness failures
        if: ${{ always() && steps.initialize_evidence.outcome == 'success' }}
        run: python scripts/verification/ci_failure_summary.py "$env:HARNESS_CI_EVIDENCE"
      - name: Clean owned broad harness evidence after upload
        if: ${{ always() && steps.upload_harness.outcome == 'success' }}
        run: |
          $expected = Join-Path $env:RUNNER_TEMP "paralls-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-harness"
          if ([IO.Path]::GetFullPath($env:HARNESS_CI_EVIDENCE) -ne [IO.Path]::GetFullPath($expected)) { throw 'Evidence directory is not owned by this job' }
          if (Test-Path -LiteralPath $expected) { Remove-Item -LiteralPath $expected -Recurse -Force }
